name: Trello export

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # every Monday 03:17 UTC

permissions:
  contents: write

concurrency:
  group: trello-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export board from Trello
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD: ${{ vars.TRELLO_BOARD || '2Fa6uRao' }}
        run: python scripts/trello_export.py --out archive

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add -A archive
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Trello export $(date -u +%Y-%m-%d)"
            git push
          fi

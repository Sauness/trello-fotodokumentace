name: Galerie (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "archive/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  # The weekly export pushes with GITHUB_TOKEN, which does not trigger `push`
  # workflows, so rebuild the gallery whenever the export finishes.
  workflow_run:
    workflows: ["Trello export"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install Pillow==11.3.0

      - name: Build gallery
        run: python scripts/build_site.py --archive archive --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
